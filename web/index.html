<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Recast Books</title>
<link rel="stylesheet" href="/colors_and_type.css">
<link rel="stylesheet" href="/kit.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  /* App-shell styles specific to Recast Books. Do not touch kit.css / colors_and_type.css
     (shared visual kit, copied read-only from the admin site) — everything below is
     additive, the same way admin/index.html layers its own <style> on top of the kit. */

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--color-bg); color: var(--color-fg); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  .hidden { display: none !important; }
  button { font-family: var(--font-sans); }

  /* ---------- Sign-in ---------- */
  #signin { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  #signin .card { width: 100%; max-width: 380px; padding: 36px 32px; text-align: center; }
  #signin .brandmark { font-family: var(--font-display); font-weight: 700; font-size: 22px; color: var(--color-fg); margin: 0 0 4px; letter-spacing: var(--tracking-tight); }
  #signin .brandmark span { color: var(--color-brand); }
  #signin .sub { color: var(--color-fg-muted); font-size: 14px; margin: 0 0 26px; }
  #gsi-button { display: flex; justify-content: center; margin: 0 0 14px; min-height: 40px; }
  #signin-error { margin-top: 14px; padding: 11px 14px; border-radius: var(--radius-md); background: var(--error-50); color: var(--error-700); font-size: 13.5px; text-align: left; }

  /* ---------- App shell ---------- */
  #app { display: flex; min-height: 100vh; }
  #sidebar { width: 220px; flex: none; background: var(--color-bg-elevated); border-right: 1px solid var(--color-border); display: flex; flex-direction: column; padding: 20px 0; }
  #sidebar .brand { font-family: var(--font-display); font-weight: 700; font-size: 17px; padding: 0 20px 22px; color: var(--color-fg); letter-spacing: var(--tracking-tight); }
  #sidebar .brand span { color: var(--color-brand); }
  #sidebar nav { display: flex; flex-direction: column; gap: 2px; padding: 0 10px; }
  #sidebar nav a { display: block; padding: 10px 12px; border-radius: var(--radius-sm); color: var(--color-fg-muted); font-weight: 600; font-size: 14.5px; cursor: pointer; border-left: 3px solid transparent; }
  #sidebar nav a:hover { background: var(--color-bg-sunken); color: var(--color-fg); }
  #sidebar nav a.active { background: var(--terracotta-100); color: var(--terracotta-800); border-left-color: var(--color-brand); }
  #sidebar .userbox { margin-top: auto; padding: 14px 20px 0; border-top: 1px solid var(--color-divider); }
  #sidebar .userbox .name { font-weight: 700; font-size: 14px; color: var(--color-fg); }
  #sidebar .userbox .role { font-size: 12px; color: var(--color-fg-subtle); text-transform: capitalize; margin: 2px 0 10px; }

  #main { flex: 1; min-width: 0; padding: 28px 34px 80px; }
  #main .page-title { font-family: var(--font-display); font-weight: 700; font-size: 24px; margin: 0 0 20px; }

  .cards-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 26px; }
  .stat-card { padding: 18px 20px; }
  .stat-card .label { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: var(--tracking-wide); color: var(--color-fg-subtle); margin: 0 0 8px; }
  .stat-card .value { font-family: var(--font-display); font-weight: 700; font-size: 22px; color: var(--color-fg); }
  .stat-card .value a { color: var(--color-brand-press); text-decoration: underline; font-size: 15px; }
  .stat-card .value.muted { color: var(--color-fg-subtle); font-size: 15px; font-weight: 600; }

  .banner { padding: 12px 16px; border-radius: var(--radius-md); font-size: 13.5px; margin-bottom: 16px; display: flex; gap: 8px; align-items: flex-start; }
  .banner.error { background: var(--error-50); color: var(--error-700); }
  .banner.success { background: var(--success-50); color: var(--success-700); }
  .banner code { background: rgba(0,0,0,0.08); padding: 1px 6px; border-radius: 4px; font-family: var(--font-mono); font-size: 12px; }

  table.rc-table { width: 100%; border-collapse: collapse; background: var(--white); border-radius: var(--radius-md); overflow: hidden; }
  table.rc-table th { text-align: left; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: var(--tracking-wide); color: var(--color-fg-subtle); padding: 10px 12px; border-bottom: 1px solid var(--color-border); background: var(--color-bg-sunken); }
  table.rc-table td { padding: 10px 12px; border-bottom: 1px solid var(--color-divider); font-size: 13.5px; vertical-align: top; }
  table.rc-table tr.clickable { cursor: pointer; }
  table.rc-table tr.clickable:hover { background: var(--color-bg-sunken); }
  table.rc-table td.num, table.rc-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .lines-row td { background: var(--paper-deep); padding: 0; }
  .lines-row .lines-wrap { padding: 12px 16px; }

  .section-card { background: var(--white); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 20px 22px; margin-bottom: 24px; }
  .section-card h3 { font-family: var(--font-display); font-size: 16px; margin: 0 0 14px; }

  .tabbar { display: flex; gap: 6px; margin-bottom: 16px; }
  .tabbar button { padding: 8px 16px; border-radius: var(--radius-pill); border: 1.5px solid var(--color-border); background: var(--white); font-weight: 700; font-size: 13.5px; cursor: pointer; color: var(--color-fg-muted); }
  .tabbar button.active { background: var(--color-brand); border-color: var(--color-brand); color: #fff; }

  .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .form-grid .full { grid-column: 1 / -1; }
  .req-mark { color: var(--error-500); }

  .lines-grid { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
  .lines-grid th { text-align: left; font-size: 11px; text-transform: uppercase; color: var(--color-fg-subtle); padding: 4px 6px; }
  .lines-grid td { padding: 4px 6px; }
  .lines-grid input, .lines-grid select { font-family: var(--font-sans); font-size: 13px; padding: 7px 8px; border-radius: 8px; border: 1.5px solid var(--ink-200); width: 100%; background: var(--white); }
  .lines-grid .rm-btn { background: none; border: none; color: var(--error-500); cursor: pointer; font-size: 16px; padding: 2px 6px; }
  .balance-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 4px; font-weight: 700; font-size: 13.5px; }
  .balance-row.ok { color: var(--success-700); }
  .balance-row.off { color: var(--error-700); }

  .pill { display: inline-block; padding: 3px 10px; border-radius: var(--radius-pill); font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }
  .pill.open { background: var(--success-50); color: var(--success-700); }
  .pill.closed { background: var(--ink-100); color: var(--ink-600); }

  .muted-note { background: var(--info-50); color: var(--info-700); padding: 10px 16px; border-radius: var(--radius-md); font-size: 13.5px; margin-bottom: 18px; }
  .details-toggle summary { cursor: pointer; font-size: 12px; color: inherit; font-weight: 700; margin-top: 4px; }
  .details-toggle pre { white-space: pre-wrap; font-size: 11.5px; margin: 6px 0 0; font-family: var(--font-mono); }
  .page-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }

  @media (max-width: 820px) {
    #app { flex-direction: column; }
    #sidebar { width: 100%; flex-direction: row; align-items: center; padding: 10px 12px; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--color-border); }
    #sidebar .brand { padding: 0 14px 0 4px; margin: 0; white-space: nowrap; }
    #sidebar nav { flex-direction: row; padding: 0; }
    #sidebar nav a { white-space: nowrap; border-left: none; border-bottom: 3px solid transparent; }
    #sidebar nav a.active { border-left-color: transparent; border-bottom-color: var(--color-brand); }
    #sidebar .userbox { margin-top: 0; margin-left: auto; padding: 0 0 0 14px; border-top: none; border-left: 1px solid var(--color-divider); text-align: left; white-space: nowrap; }
    #main { padding: 20px 16px 60px; }
    .form-grid { grid-template-columns: 1fr; }
  }

  /* ---------- Phase 2 additions (Inbox / Upload) ---------- */
  .nav-badge { display: inline-block; min-width: 18px; padding: 1px 6px; margin-left: 6px; border-radius: var(--radius-pill);
    background: var(--color-brand); color: #fff; font-size: 11px; font-weight: 800; text-align: center; line-height: 1.5; }
  #sidebar nav a.active .nav-badge { background: var(--terracotta-700); }

  .pill.warn { background: var(--warning-50); color: var(--warning-700); }
  .pill.info { background: var(--info-50); color: var(--info-700); }
  .pill.error { background: var(--error-50); color: var(--error-700); }

  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chip { display: inline-block; padding: 3px 10px; border-radius: var(--radius-pill); font-size: 11px; font-weight: 700;
    background: var(--error-50); color: var(--error-700); font-family: var(--font-mono); letter-spacing: 0.01em; }

  .inbox-card { background: var(--white); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 18px 20px; margin-bottom: 18px; }
  .inbox-card.highlight { box-shadow: 0 0 0 3px var(--color-focus-ring), var(--shadow-sm); }
  .inbox-card .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
  .inbox-card .card-summary { font-size: 14px; line-height: 1.6; }
  .inbox-card .card-summary .k { color: var(--color-fg-subtle); font-weight: 700; margin-right: 4px; }
  .inbox-card .doc-id { font-family: var(--font-mono); font-size: 11.5px; color: var(--color-fg-subtle); }
  .why-note { background: var(--paper-deep); border-radius: var(--radius-md); padding: 10px 14px; font-size: 13.5px; margin: 10px 0; }
  .why-note .lbl { font-weight: 800; text-transform: uppercase; font-size: 10.5px; letter-spacing: var(--tracking-wide); color: var(--color-fg-subtle); display: block; margin-bottom: 3px; }

  .thumb-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .thumb-tile { width: 84px; height: 84px; border-radius: var(--radius-sm); overflow: hidden; background: var(--ink-50);
    border: 1.5px solid var(--ink-200); cursor: pointer; display: flex; align-items: center; justify-content: center; flex: none; }
  .thumb-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb-tile.pdf-tile { flex-direction: column; gap: 4px; font-size: 11px; font-weight: 700; color: var(--color-fg-muted); }
  .thumb-tile .thumb-err { font-size: 11px; color: var(--error-700); padding: 4px; text-align: center; }

  .entry-block { border: 1.5px solid var(--color-divider); border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 12px; }
  .entry-block:last-of-type { margin-bottom: 4px; }
  .entry-total { text-align: right; font-size: 12.5px; color: var(--color-fg-muted); margin-top: 4px; }
  .card-verbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .card-verbs button { padding: 7px 14px; font-size: 13px; }

  .processing-card { background: var(--paper-warm); border: 1.5px solid var(--terracotta-200); border-radius: var(--radius-md);
    padding: 12px 16px; font-size: 13.5px; margin-bottom: 16px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(24,25,28,0.72); display: flex; align-items: center;
    justify-content: center; z-index: 1000; padding: 24px; }
  .modal-box { max-width: 92vw; max-height: 92vh; overflow: auto; background: var(--white); border-radius: var(--radius-md); padding: 8px; }
  .modal-close { position: fixed; top: 18px; right: 22px; z-index: 1001; background: rgba(255,255,255,0.9); border: none;
    border-radius: 50%; width: 36px; height: 36px; font-size: 20px; line-height: 1; cursor: pointer; color: var(--color-fg); }

  .dropzone { border: 2px dashed var(--ink-300); border-radius: var(--radius-lg); padding: 36px 20px; text-align: center;
    cursor: pointer; color: var(--color-fg-muted); background: var(--white); }
  .dropzone.dragover { border-color: var(--color-brand); background: var(--paper-warm); color: var(--color-fg); }
  .dropzone .dz-title { font-weight: 700; font-size: 15px; color: var(--color-fg); margin-bottom: 4px; }
  .upload-filelist { margin: 16px 0; display: flex; flex-direction: column; gap: 8px; }
  .upload-file-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm); background: var(--paper-deep); font-size: 13px; }
  .upload-file-row.invalid { background: var(--error-50); color: var(--error-700); }
  .upload-file-row .uf-thumb { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; flex: none; background: var(--ink-100); }
  .upload-file-row .uf-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .upload-file-row .uf-rm { background: none; border: none; color: var(--error-500); cursor: pointer; font-size: 16px; }

  @media (max-width: 820px) {
    .inbox-card .card-head { flex-direction: column; }
    .thumb-tile { width: 68px; height: 68px; }
  }
</style>
</head>
<body>

<!-- SIGN-IN -->
<div id="signin">
  <div class="card">
    <p class="brandmark">Recast <span>Books</span></p>
    <p class="sub">Sign in with your Recast Properties Google account.</p>
    <div id="gsi-button"></div>
    <p id="signin-error" class="hidden"></p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div id="sidebar">
    <div class="brand">Recast <span>Books</span></div>
    <nav id="nav">
      <a href="#dashboard" data-page="dashboard">Dashboard</a>
      <a href="#inbox" data-page="inbox">Inbox <span class="nav-badge hidden" id="inbox-badge">0</span></a>
      <a href="#upload" data-page="upload">Upload</a>
      <a href="#settings" data-page="settings">Settings</a>
    </nav>
    <div class="userbox">
      <div class="name" id="userbox-name"></div>
      <div class="role" id="userbox-role"></div>
      <button class="btn btn-secondary" id="signout-btn" style="width:100%;padding:8px 10px;font-size:13px;">Sign out</button>
    </div>
  </div>
  <div id="main">
    <div id="modal-overlay" class="modal-overlay hidden">
      <button id="modal-close" class="modal-close" aria-label="Close" type="button">&times;</button>
      <div id="modal-box" class="modal-box"></div>
    </div>
    <div id="page-dashboard" class="page"></div>
    <div id="page-inbox" class="page hidden"></div>
    <div id="page-upload" class="page hidden"></div>
    <div id="page-settings" class="page hidden"></div>
  </div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
