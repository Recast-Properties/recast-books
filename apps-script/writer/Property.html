<?!= include_('Style') ?>
<h3>Add property</h3>
<div class="row">
  <div><label>Name</label><input type="text" id="p-name" placeholder="881 Newport"></div>
  <div><label>Address</label><input type="text" id="p-address"></div>
</div>
<div class="row">
  <div><label>Status</label><select id="p-status"><option value="held" selected>held</option><option value="sold">sold</option></select></div>
  <div><label>Template</label><input type="text" id="p-template"></div>
</div>
<div class="row">
  <div><label>Purchase date</label><input type="date" id="p-purchase-date"></div>
  <div><label>Purchase price</label><input type="text" id="p-purchase-price" placeholder="207000.00"></div>
</div>
<div class="row">
  <div><label>Contract price (optional)</label><input type="text" id="p-contract-price" placeholder="290000"></div>
  <div><label>Annual property tax</label><input type="text" id="p-tax-annual" placeholder="7942"></div>
</div>
<div class="row">
  <div><label>Dennis profit share % (0 = bank only)</label><input type="text" id="p-dennis-share" value="50"></div>
  <div><label>Settlement date</label><input type="date" id="p-settlement-date"></div>
</div>
<div class="row">
  <div><label>Dennis-funded</label><select id="p-dennis-funded"><option value="true">Yes</option><option value="false" selected>No</option></select></div>
  <div><label>Drive folder</label><input type="text" id="p-drive-folder" placeholder="https://drive.google.com/..."></div>
</div>
<label>Notes</label><input type="text" id="p-notes">
<button class="primary" id="p-save">Add property</button>
<div id="p-msg" class="msg hidden"></div>

<script>
  document.getElementById('p-save').addEventListener('click', function () {
    var btn = this;
    var msg = document.getElementById('p-msg');
    msg.classList.add('hidden');
    var name = document.getElementById('p-name').value.trim();
    if (!name) { showMsg_(msg, false, 'Name is required.'); return; }
    var form = {
      name: name,
      address: document.getElementById('p-address').value,
      status: document.getElementById('p-status').value,
      template: document.getElementById('p-template').value,
      purchase_date: document.getElementById('p-purchase-date').value,
      purchase_price: document.getElementById('p-purchase-price').value,
      contract_price: document.getElementById('p-contract-price').value,
      tax_annual: document.getElementById('p-tax-annual').value,
      dennis_share_pct: document.getElementById('p-dennis-share').value,
      settlement_date: document.getElementById('p-settlement-date').value,
      dennis_funded: document.getElementById('p-dennis-funded').value,
      drive_folder: document.getElementById('p-drive-folder').value,
      notes: document.getElementById('p-notes').value
    };
    btn.disabled = true;
    btn.textContent = 'Saving...';
    callServer_('addProperty', form).then(function (result) {
      btn.disabled = false;
      btn.textContent = 'Add property';
      if (!result.ok) { showMsg_(msg, false, '<b>' + escapeHtml_(result.error) + '</b> - ' + escapeHtml_(result.message)); return; }
      var html = 'Saved <code>' + escapeHtml_(result.name) + '</code>.';
      html += result.tabError ? ' Property tab was not built: ' + escapeHtml_(result.tabError) : ' Property tab built (' + result.tabRows + ' rows).';
      showMsg_(msg, true, html);
      setTimeout(function () { google.script.host.close(); }, 2200);
    }, function (err) {
      btn.disabled = false;
      btn.textContent = 'Add property';
      showMsg_(msg, false, escapeHtml_(err && err.message ? err.message : err));
    });
  });
</script>
