<?!= include_('Style') ?>
<?!= include_('InboxCard') ?>
<style>
  body { padding: 8px 10px; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .top h3 { margin: 0; }
  .top button { padding: 4px 10px; font-size: 12px; margin: 0; }
  .card { border: 1px solid #ddd; border-radius: 4px; padding: 8px; margin-bottom: 10px; }
  .card .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; cursor: pointer; user-select: none; }
  .card .head .vendor { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .head .when { flex: 0 0 74px; color: #555; font-size: 11px; }
  .card .head .amt { flex: 0 0 78px; text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; }
  .card .head .tw { flex: 0 0 10px; color: #777; font-size: 10px; }
  .card.closed { padding: 5px 8px; margin-bottom: 4px; }
  .card.closed .body { display: none; }
  .card.open .head { margin-bottom: 4px; }
  #filter { width: 100%; box-sizing: border-box; margin-bottom: 8px; }
  #tabs { display: flex; margin-bottom: 8px; border-bottom: 1px solid #ddd; }
  #tabs button { flex: 1; margin: 0; padding: 6px 4px; font-size: 12px; border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; color: #555; }
  #tabs button.on { border-bottom-color: #1a73e8; color: #1a73e8; font-weight: bold; }
  .card .vendor { font-weight: bold; font-size: 13px; }
  .card .sub { color: #555; font-size: 11px; margin: 2px 0 6px; }
  .pill { font-size: 10px; padding: 1px 6px; border-radius: 8px; background: #eee; }
  .pill.high { background: #e6f4ea; color: #137333; }
  .pill.medium { background: #fef7e0; color: #b06000; }
  .pill.low { background: #fce8e6; color: #a50e0e; }
  .thumb { display: block; max-width: 100%; max-height: 220px; border: 1px solid #ddd; margin-bottom: 6px; cursor: zoom-in; }
  .thumb.big { max-height: none; cursor: zoom-out; }
  .pdf { display: inline-block; padding: 6px 10px; border: 1px solid #ddd; background: #f6f6f6; font-size: 11px; margin-bottom: 6px; }
  .why { background: #f6f6f6; border-left: 3px solid #bbb; padding: 4px 8px; font-size: 11px; margin-bottom: 6px; }
  .flags { margin: 0 0 6px; padding-left: 16px; font-size: 11px; }
  .flags li { margin-bottom: 2px; }
  .flags li.act { color: #b06000; font-weight: bold; }
  .entry { border-top: 1px dashed #ddd; padding-top: 6px; margin-top: 6px; }
  .rcpt { font-weight: bold; font-size: 12px; margin-bottom: 4px; }
  .item { background: #fafafa; padding: 4px 6px; margin-bottom: 4px; border-radius: 3px; position: relative; }
  .item .dec { margin-bottom: 4px; }
  .item .dec button { font-size: 11px; padding: 2px 8px; margin: 0 4px 0 0; }
  .item .dec button.on { background: #1a73e8; color: #fff; border-color: #1a73e8; }
  .item .dec input { width: 50%; margin: 0 0 0 4px; }
  .item.off > :not(.dec) { opacity: .4; }
  .item input, .item select, .entry select { margin-bottom: 4px; }
  .item .row3 { display: flex; gap: 6px; }
  .item .row3 > div:first-child { flex: 0 0 90px; }
  .item .row3 > div { flex: 1; }
  .item .row3 > div.tr { flex: 0 0 104px; }
  .thumb { max-height: 320px; }
  .add { font-size: 11px; padding: 3px 8px; margin: 0 0 6px; }
  .totals { font-size: 11px; margin: 4px 0 6px; }
  .totals.ok { color: #137333; }
  .totals.off { color: #a50e0e; font-weight: bold; }
  .verbs button { font-size: 12px; padding: 5px 10px; margin: 0 6px 4px 0; }
  .note { margin-top: 6px; }
  .docid { font-size: 10px; color: #999; word-break: break-all; }
  .wait { display: block; font-size: 11px; margin: 6px 0; padding: 5px 8px; background: #fef7e0; border-radius: 3px; }
  .wait select { width: auto; display: inline-block; margin: 0 4px; }
  .wait button { font-size: 11px; padding: 3px 8px; margin: 0; }
  .wait input { width: auto; margin: 0 4px 0 0; }
  a { color: #1a73e8; }
  .loading { color: #444; line-height: 1.8; }
  .loading .bar { height: 6px; background: #e6e6e6; border-radius: 3px; overflow: hidden; margin: 2px 0 8px; }
  .loading .bar div { width: 0; height: 100%; background: #1a73e8; transition: width .3s; }
</style>

<div class="top">
  <h3>Inbox <span id="count"></span></h3>
  <div><button id="collapse">Collapse all</button> <button id="refresh">Refresh</button></div>
</div>
<div id="tabs"><button data-tab="receipts">Receipts <span></span></button><button data-tab="bank">Bank statement <span></span></button></div>
<div id="heartbeat" class="docid"></div>
<input id="filter" placeholder="Filter: vendor, subject, date, amount, property...">
<div id="msg" class="msg hidden"></div>
<div id="list">Loading...</div>
<p id="empty" class="hidden">Nothing waiting here.</p>

<script>
  var DATA = { envelopes: [], pickers: { accounts: [], properties: [], bankAccounts: [] }, site: '' };
  var EDIT = {}; // docId -> editable entries (deep copy of model.entries)
  var OPEN = {}; // docId -> true while its card is toggled open (the list starts collapsed)
  var SWAP = {}; // docId -> false once Paul unticks "This is the receipt I was waiting for" (D-057)
  // D-057: a charge recorded from the bank statement while its receipt is with someone else. The
  // words are lib/gate.mjs's NEED_RECEIPT - the books find a placeholder by them (a lint compares).
  var NEED_RECEIPT = 'NEED RECEIPT FROM';
  // The card's logic lives in lib/inbox-card.mjs (InboxCard.html here, audit 2026-10-24 #19); it takes the dialog's
  // state as arguments - these two hand it over.
  function ceiling_() { return Number((DATA.pickers && DATA.pickers.autofileCeilingCents) || 0); }
  function cardState_() { return { swap: SWAP, accounts: DATA.pickers.accounts || [], ceiling: ceiling_() }; }
  // The bank line is the proof of who paid: while the box is ticked the card is paid from that
  // account; unticked, each line goes back to what the receipt itself said.
  function applySwap_(env) {
    var swap = swapOf_(env, SWAP), read = (env.model && env.model.entries) || [];
    if (!(env.gate && env.gate.placeholder) || env.source === 'feed') return;
    (EDIT[env.docId] || []).forEach(function (e, i) { e.paid_from = swap ? swap.paid_from : ((read[i] || {}).paid_from || 'UNKNOWN'); });
  }
  // Two tabs, one Inbox (Paul, 2026-09-29: the bank statement's questions apart from the receipts).
  var TAB = 'receipts';
  // shown: how many cards on the open tab pass the filter, when one is typed.
  function counts_(shown) {
    var n = { receipts: 0, bank: 0 };
    DATA.envelopes.forEach(function (e) { n[tabOf_(e)]++; });
    document.getElementById('count').textContent = DATA.envelopes.length ? '(' + DATA.envelopes.length + ')' : '';
    document.querySelectorAll('#tabs button').forEach(function (b) {
      var t = b.dataset.tab;
      b.classList.toggle('on', t === TAB);
      b.querySelector('span').textContent = n[t] ? '(' + (t === TAB && shown != null ? shown + ' of ' + n[t] : n[t]) + ')' : '';
    });
    document.getElementById('empty').classList.toggle('hidden', !DATA.ok || n[TAB] > 0);   // never "nothing waiting" over a failed load
    return n;
  }

  function accountOpts_(sel) {
    var html = opt_('', 'What kind of cost is this? Choose...', !sel);   // plain words: "Choose..." alone did not say what (Paul, 2026-10-01)
    ACCT_GROUPS.forEach(function (g) {
      var inGroup = DATA.pickers.accounts.filter(function (a) { return acctGroup_(a.code) === g; });
      if (!inGroup.length) return;
      html += '<optgroup label="' + escapeHtml_(g) + '">' +
        inGroup.map(function (a) { return opt_(a.code, a.code + ' ' + a.name, a.code === sel); }).join('') + '</optgroup>';
    });
    return html;
  }
  function propertyOpts_(sel) {
    // A hold may leave the property for Paul to pick; the first house must not look chosen.
    return (sel ? '' : opt_('', '- pick a property -', true)) +
      DATA.pickers.properties.map(function (p) { return opt_(p, p, p === sel); }).join('') + opt_('OVERHEAD', 'OVERHEAD', sel === 'OVERHEAD');
  }
  function tradeOpts_(sel) {
    var known = DATA.pickers.trades || [];
    var html = opt_('', '- no trade -', !sel);
    if (sel && known.indexOf(sel) < 0) html += opt_(sel, sel, true);   // whatever is already on the line
    return html + known.map(function (t) { return opt_(t, t, t === sel); }).join('');
  }
  function paidFromOpts_(sel) {
    // D-014: UNKNOWN never silently becomes the first account; the engine refuses it.
    var html = (!sel || sel === 'UNKNOWN') ? opt_('UNKNOWN', '- assign account -', true) : '';
    html += DATA.pickers.bankAccounts.map(function (b) { return opt_(b.code, b.code + ' ' + b.name, b.code === sel); }).join('');
    return html + opt_('PAUL', 'PAUL (personal)', sel === 'PAUL') + opt_('DENNIS', 'DENNIS (direct)', sel === 'DENNIS') +
      opt_('1530', '1530 Supplies on hand (off the shelf)', sel === '1530');   // D-095
  }









  function learnedNote_(l) {
    if (!l) return '';
    if (l.error) return '<div style="color:#a50e0e">Recorded, but the card number was not remembered: ' + escapeHtml_(l.error) + ' - tell Claude.</div>';
    var n = (l.started || []).length;
    return '<div>Card ending ' + escapeHtml_(l.last4) + ' is on file for ' + escapeHtml_(l.name) + ' now' +
      (n ? ' - ' + n + ' other waiting card' + (n === 1 ? '' : 's') + ' with that number ' + (n === 1 ? 'is' : 'are') + ' being recorded with it' : '') +
      (l.relearn_error ? ' (the other cards could not be re-run: ' + escapeHtml_(l.relearn_error) + ')' : '') + '.</div>';
  }
  // Audit 2026-10-24 #10c: when the mail was last checked, under the tabs; red past three hours.
  function heartbeatLine_(hb) {
    var el = document.getElementById('heartbeat');
    if (!el) return;
    var at = hb && hb.paul && hb.paul.at ? new Date(hb.paul.at) : null;
    if (!at || isNaN(at.getTime())) { el.textContent = 'Mail: the poller has never reported in - tell Claude'; el.style.color = '#a50e0e'; return; }
    var age = Date.now() - at.getTime();
    var when = at.toLocaleString('en-US', { timeZone: 'America/Chicago', weekday: 'short', hour: 'numeric', minute: '2-digit' });
    el.textContent = 'Mail last checked ' + when + (age > 3 * 3600000 ? ' - more than three hours ago, tell Claude' : '');
    el.style.color = age > 3 * 3600000 ? '#a50e0e' : '#999';
  }
  // Audit 2026-10-24 #17: a bank card answered in words re-runs the matching by itself (Import statement already
  // does), in this card's box - the line went back carrying Paul's words and the bookkeeper reads them now, not after
  // a second trip to the menu. A run already going on the account is joined, then one more follows with this answer
  // in (startFeedMatch's `joined`). The same loop as Import.html's match_.
  var MATCH_POLLS = 60, MATCH_WAIT_MS = 5000;   // FEED_MATCH_POLLS / FEED_MATCH_WAIT_MS in Menu.gs: five minutes
  // 2026-10-25: the receipt for a bank card, picked on the card. Each file becomes {name, mime, base64} for /api/upload
  // (a 6 MB POST, books-upload.mjs): a PDF over 4 MB is refused in words; a photo over 1 MB is drawn down to 2000 px on
  // its long side as a JPEG - a phone photo is 3-8 MB and reads just as well at that size.
  function readReceiptFiles_(files) {
    var MAX_PDF = 4 * 1024 * 1024;
    return Promise.all(Array.prototype.map.call(files, function (f) {
      return new Promise(function (resolve, reject) {
        var isImg = /^image\//.test(f.type || '');
        if (!isImg && f.size > MAX_PDF) return reject(new Error(f.name + ' is ' + (f.size / 1048576).toFixed(1) + ' MB - a PDF has to be under 4 MB to send from here. Email it to receipts@ instead.'));
        var r = new FileReader();
        r.onerror = function () { reject(new Error('Could not read ' + f.name)); };
        r.onload = function () {
          var dataUrl = String(r.result);
          var asIs = { name: f.name, mime: f.type || 'application/octet-stream', base64: dataUrl.split(',')[1] || '' };
          if (!isImg || f.size <= 1024 * 1024) return resolve(asIs);
          var img = new Image();
          img.onerror = function () { resolve(asIs); };
          img.onload = function () {
            var s = Math.min(1, 2000 / Math.max(img.width, img.height));
            var c = document.createElement('canvas');
            c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            resolve({ name: f.name.replace(/\.[^.]+$/, '') + '.jpg', mime: 'image/jpeg', base64: c.toDataURL('image/jpeg', 0.85).split(',')[1] });
          };
          img.src = dataUrl;
        };
        r.readAsDataURL(f);
      });
    }));
  }

  function rematch_(account, msg) {
    var m = document.createElement('div');
    m.style.marginTop = '6px';
    msg.appendChild(m);
    var say = function (html) { m.innerHTML = html; };
    var fail = function (err) { say('<span style="color:#a50e0e">The bookkeeper did not get to read your answer: ' + escapeHtml_(err && err.message ? err.message : err) + ' - run Recast Books -> Match statement lines when you are done here.</span>'); };
    var again = 0;
    (function start() {
      say('Claude is reading your answer against the bank lines...');
      callServer_('startFeedMatch', account).then(function (r) {
        if (!r.ok) return fail(r);
        if (!r.count) return say('Nothing left to match on this account.');
        var i = 0;
        (function poll() {
          if (i > MATCH_POLLS) return say('Still running after five minutes - the notes land on the Feed tab when it finishes; click Refresh later.');
          say((r.joined ? 'The bookkeeper was already going through this account - waiting for that run, then one more with your answer in... '
            : 'Claude is reading your answer against the ' + r.count + ' open bank line' + (r.count === 1 ? '' : 's') + '... ') + Math.round(i++ * MATCH_WAIT_MS / 1000) + ' s');
          setTimeout(function () {
            callServer_('feedMatchStatus', r.job_id).then(function (s) {
              if (!s.ok) return fail(s);
              if (!s.done) return poll();
              if (r.joined && again++ < 1) return start();   // that run began before your answer landed - one more, with it in
              say('<b>Done.</b> ' + escapeHtml_(s.message).replace(/\n/g, '<br>') + '<br><a href="#" data-refresh="1">Refresh</a> to see what changed.');
              m.querySelector('[data-refresh]').onclick = function (e) { e.preventDefault(); load_(); };
            }, fail);
          }, MATCH_WAIT_MS);
        })();
      }, fail);
    })();
  }
  function feedNote_(f) {
    if (!f) return '';
    if (f.ok === false) return '<div style="color:#a50e0e">Recorded, but the bank line for it was not tied: ' + escapeHtml_(f.message || f.error || 'unknown') + ' - tell Claude.</div>';
    if (f.retired && f.retired.length) return '<div>The bank line for this charge is tied and its card has left the Bank statement tab.</div>';
    return '';
  }




  function renderCard_(env) {
    var m = env.model || {};
    var gate = env.gate || {};
    var d = escapeHtml_(env.docId);
    var entries = EDIT[env.docId];
    if (!entries) {
      entries = EDIT[env.docId] = JSON.parse(JSON.stringify(m.entries || []));
      entries.forEach(function (e) { (e.items || []).forEach(function (it) { if (it.property === undefined) it.property = e.property || ''; }); });
      // Paul, 2026-09-28: a card the read left empty still shows one full line to type into ("i need a way to
      // enter the information if none is present") - the same fields as any other line. The house defaults
      // to the mailbox it came in on; a blank line saves nothing (sortByDecision_). Partner money gets no line.
      if (!entries.length && !partnerMoney_(env, ceiling_())) {
        var home = m.property || (DATA.pickers.properties.indexOf(env.channel) >= 0 ? env.channel : '');
        // date, payee and memo are what a read's entry carries and what posting needs (purchaseIntentFromEntry).
        entries.push({ date: m.date || String(env.receivedAt || '').slice(0, 10), payee: m.vendor || '', memo: 'typed by Paul in the Inbox - Claude found nothing to record',
          property: home, paid_from: m.paid_from || '', items: [{ account: '', amount_cents: 0, description: '', trade: '', business_purpose: '', property: home }] });
      }
      applySwap_(env);
    }
    var props = []; entries.forEach(function (e) { if (e.property && props.indexOf(e.property) < 0) props.push(e.property); });

    var atts = (env.attachments || []).map(function (a, i) {
      if (String(a.mime || '').indexOf('image/') === 0) {
        return '<img class="thumb" data-key="' + escapeHtml_(a.key || ('att/' + env.docId + '/' + i)) + '" alt="picture loading..." title="Click to enlarge">';
      }
      return '<a class="pdf" href="#" data-file="' + escapeHtml_(a.key || ('att/' + env.docId + '/' + i)) + '" data-mime="' + escapeHtml_(a.mime || 'application/pdf') + '">PDF: ' + escapeHtml_(a.name || 'open') + '</a>';
    }).join('');

    // One email with several receipts in it (Paul, 2026-10-02: six Squarespace bills "showing up as one"):
    // each is recorded on its own date, so the card says so - a count up top, a heading on each.
    var many = entries.some(function (e) { return e.date !== entries[0].date; });
    var entriesHtml = entries.map(function (e, ei) {
      var items = (e.items || []).map(function (it, ii) {
        var dec = decisionOf_(it);
        return '<div class="item' + (dec === 'approve' ? '' : ' off') + '">' +
          '<div class="dec">' + Object.keys(DECISIONS).map(function (k) {
            return '<button class="' + (k === dec ? 'on' : '') + '" data-dec="' + k + '" data-e="' + ei + '" data-i="' + ii + '">' + DECISIONS[k] + '</button>';
          }).join('') +
          (dec === 'dismiss' ? '<input data-e="' + ei + '" data-i="' + ii + '" data-f="reason" value="' + escapeHtml_(it.reason || '') + '" placeholder="Why? (personal, duplicate...)">' : '') +
          '</div>' +
          '<select data-e="' + ei + '" data-i="' + ii + '" data-f="account">' + accountOpts_(it.account) + '</select>' +
          '<div class="row3"><div><input data-e="' + ei + '" data-i="' + ii + '" data-f="amount" value="' + escapeHtml_((Number(it.amount_cents || 0) / 100).toFixed(2)) + '" placeholder="Amount"></div>' +
          '<div><input data-e="' + ei + '" data-i="' + ii + '" data-f="description" value="' + escapeHtml_(it.description || '') + '" placeholder="Description"></div>' +
          '<div class="tr"><select data-e="' + ei + '" data-i="' + ii + '" data-f="trade">' + tradeOpts_(it.trade || '') + '</select></div></div>' +
          '<label>House for this item (each item can differ)</label><select data-e="' + ei + '" data-i="' + ii + '" data-f="property">' + propertyOpts_(itemProperty_(e, it)) + '</select>' +
          '<input data-e="' + ei + '" data-i="' + ii + '" data-f="business_purpose" value="' + escapeHtml_(it.business_purpose || '') + '" placeholder="Business reason (meals, gifts, travel)">' +
          '</div>';
      }).join('');
      var sum = (e.items || []).reduce(function (t, it) { return t + (Number(it.amount_cents) || 0); }, 0);
      return '<div class="entry">' +
        (many ? '<div class="rcpt">Receipt ' + (ei + 1) + ' of ' + entries.length + ': ' + escapeHtml_(e.date || '-') + ' &middot; ' + money_(sum) + (e.memo ? ' &middot; ' + escapeHtml_(e.memo) : '') + '</div>' : '') +
        '<div class="row"><div><label>Property for every item (then change any one item below)</label><select data-e="' + ei + '" data-f="property">' + propertyOpts_(e.property) + '</select></div>' +
        '<div><label>Paid from</label><select data-e="' + ei + '" data-f="paid_from">' + paidFromOpts_(e.paid_from) + '</select></div></div>' +
        items + '<button class="add" data-add="' + ei + '">+ item</button></div>';
    }).join('');

    var read = [m.why, m.checked].filter(Boolean).map(function (t) { return escapeHtml_(t); }).join('<br><br>');
    var isOpen = !!OPEN[env.docId];
    var title = m.vendor || ('(no vendor) ' + (env.subject || '')).trim();
    if (env.source === 'feed') title += ' - ' + ((env.feed && env.feed.card && env.feed.card.holder) || 'Unknown');   // who paid (Paul, 2026-09-29)
    var search = [m.vendor, env.subject, m.date, (Number(m.receipt_total_cents || 0) / 100).toFixed(2), props.join(' '), env.channel, env.from, env.docId].join(' ').toLowerCase();
    var head = '<div class="head" data-toggle="1"><span class="tw">' + (isOpen ? '&#9662;' : '&#9656;') + '</span>' +
      '<span class="vendor" title="' + escapeHtml_(title) + '">' + escapeHtml_(title) + '</span>' +
      '<span class="when">' + (many ? entries.length + ' receipts' : escapeHtml_(m.date || String(env.receivedAt || '').slice(0, 10) || '-')) + '</span>' +
      '<span class="amt">' + (m.receipt_total_cents != null ? money_(m.receipt_total_cents) : '-') + '</span>' +
      '<span class="pill ' + escapeHtml_(m.confidence || '') + '">' + escapeHtml_(m.confidence || '-') + '</span></div>';
    if (!isOpen) return '<div class="card closed" data-doc="' + d + '" data-tab="' + tabOf_(env) + '" data-search="' + escapeHtml_(search) + '">' + head + '<div class="msg hidden" data-msg="1"></div></div>';
    return '<div class="card open" data-doc="' + d + '" data-tab="' + tabOf_(env) + '" data-search="' + escapeHtml_(search) + '">' + head + '<div class="body">' +
      '<div class="sub">' + (many ? entries.length + ' receipts in one email, each recorded on its own date' : escapeHtml_(m.date || '-')) + ' &middot; ' + (m.receipt_total_cents != null ? money_(m.receipt_total_cents) : '-') + ' &middot; ' + escapeHtml_(props.join(', ') || '-') + ' &middot; ' + escapeHtml_(env.channel || '') +
        (env.feed && env.feed.card ? ' &middot; <b>' + escapeHtml_(env.feed.card.holder) + (env.feed.card.last4 ? '\'s card (' + escapeHtml_(env.feed.card.last4) + ')' : ' paid') + '</b>' : '') + '</div>' +
      atts +
      '<ul class="flags" data-flags="1">' + flagsList_(gate, entries, m.why, env, cardState_()) + '</ul>' +
      (read ? '<details class="why"><summary>Claude\'s read</summary>' + read + '</details>' : '') +
      entriesHtml +
      '<div class="tot">' + totalsLine_(env, entries) + '</div>' +
      waitHtml_(env, entries, SWAP[env.docId]) +
      '<div class="verbs">' + (partnerMoney_(env, ceiling_()) ? '' : '<button class="primary" data-save="1">Save</button>') +
      '<button data-dismiss="1" title="The whole document is not a cost - nothing is added to the books">Dismiss all</button><button data-reprocess="1">Reprocess</button></div>' +
      '<div class="note hidden"><input data-note="1" value="' + escapeHtml_((m.entries || []).length || env.source === 'feed' ? '' : plainWhy_(m.why)) + '" placeholder="' + (env.source === 'feed' ? 'What was it? In your own words' : 'Why? (not a receipt, duplicate...)') + '"><button data-dismiss-go="1">Dismiss all</button><button data-dismiss-cancel="1">Cancel</button></div>' +
      '<div class="msg hidden" data-msg="1"></div>' +
      '<div class="docid">' + d + '</div>' +
      '</div></div>';
  }

  function render_() {
    document.getElementById('list').innerHTML = DATA.envelopes.map(renderCard_).join('');
    DATA.envelopes.forEach(wire_);
    filter_();
  }

  function filter_() {
    var words = document.getElementById('filter').value.toLowerCase().split(/\s+/).filter(Boolean);
    var shown = 0;
    document.querySelectorAll('#list .card').forEach(function (c) {
      var hit = c.dataset.tab === TAB && words.every(function (w) { return c.dataset.search.indexOf(w) >= 0; });
      c.classList.toggle('hidden', !hit);
      if (hit) shown++;
    });
    counts_(words.length ? shown : null);
  }

  function findEnv_(docId) {
    for (var i = 0; i < DATA.envelopes.length; i++) if (DATA.envelopes[i].docId === docId) return DATA.envelopes[i];
    return null;
  }

  function rerender_(docId) {
    var env = findEnv_(docId);
    var old = document.querySelector('.card[data-doc="' + docId + '"]');
    if (!env || !old) return;
    var tmp = document.createElement('div');
    tmp.innerHTML = renderCard_(env);
    old.parentNode.replaceChild(tmp.firstElementChild, old);
    wire_(env);
    filter_();
  }

  function wire_(env) {
    var card = document.querySelector('.card[data-doc="' + env.docId + '"]');
    if (!card) return;
    card.querySelector('[data-toggle]').onclick = function () { OPEN[env.docId] = !OPEN[env.docId]; rerender_(env.docId); };
    if (!OPEN[env.docId]) return;
    var entries = EDIT[env.docId];
    var msg = card.querySelector('[data-msg]');

    card.querySelectorAll('img.thumb').forEach(function (img) {
      callServer_('inboxThumb', img.dataset.key).then(function (r) {
        if (r.ok) img.src = r.dataUri; else img.alt = 'No preview';
      });
      img.onclick = function () { img.classList.toggle('big'); };
    });
    // One click (Paul, 2026-09-26: "they are buried"). The tab is opened inside the click -
    // one opened after the server round trip is a blocked pop-up - then pointed at the bytes.
    card.querySelectorAll('a[data-file]').forEach(function (a) {
      a.onclick = function (ev) {
        ev.preventDefault();
        var w = window.open('', '_blank');
        if (!w) return showMsg_(msg, false, 'The browser blocked the new tab - allow pop-ups for this sheet.');
        callServer_('inboxFile', a.dataset.file).then(function (r) {
          if (!r.ok) { w.close(); return showMsg_(msg, false, plainError_(r)); }
          var bin = atob(r.b64), bytes = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          w.location.href = URL.createObjectURL(new Blob([bytes], { type: a.dataset.mime }));
        }, function (err) { w.close(); showMsg_(msg, false, escapeHtml_(err && err.message ? err.message : err)); });
      };
    });

    card.querySelectorAll('[data-f]').forEach(function (el) {
      var h = function () {
        var e = entries[Number(el.dataset.e)];
        if (el.dataset.i === undefined) {
          e[el.dataset.f] = el.value;
          // The entry's Property is the "all of them" control; per-item overrides follow it.
          if (el.dataset.f === 'property') { (e.items || []).forEach(function (it) { it.property = el.value; }); rerender_(env.docId); return; }
          // One email, several receipts on one unknown card: who paid is picked once, not once per receipt.
          if (el.dataset.f === 'paid_from') { entries.forEach(function (o) { if (!o.paid_from || o.paid_from === 'UNKNOWN') o.paid_from = el.value; }); rerender_(env.docId); return; }
        }
        else if (el.dataset.f === 'amount') e.items[Number(el.dataset.i)].amount_cents = cents_(el.value);
        else e.items[Number(el.dataset.i)][el.dataset.f] = el.value;
        card.querySelector('.tot').innerHTML = totalsLine_(env, entries);
        var fl = card.querySelector('[data-flags]');
        if (fl) fl.innerHTML = flagsList_(env.gate || {}, entries, (env.model || {}).why, env, cardState_());
      };
      el.addEventListener('change', h);
      if (el.tagName === 'INPUT') el.addEventListener('input', h);
    });
    card.querySelectorAll('[data-dec]').forEach(function (b) {
      b.onclick = function () {
        entries[Number(b.dataset.e)].items[Number(b.dataset.i)].decision = b.dataset.dec;
        rerender_(env.docId);
      };
    });
    card.querySelectorAll('[data-add]').forEach(function (b) {
      b.onclick = function () {
        var e = entries[Number(b.dataset.add)];
        e.items.push({ account: '', amount_cents: 0, description: '', trade: '', business_purpose: '', property: e.property || '' });
        rerender_(env.docId);
      };
    });

    var waitBtn = card.querySelector('[data-wait]');
    if (waitBtn) waitBtn.onclick = function () {
      var first = entries[0] || {};
      var made = placeholderEntries_(env, card.querySelector('[data-wait-who]').value, first.property && first.property !== 'OVERHEAD' ? first.property : '');
      if (!made) return showMsg_(msg, false, 'The bank lines on this card could not be read one by one, so nothing was changed. Tell Claude.');
      EDIT[env.docId] = made;
      rerender_(env.docId);
    };
    var swapBox = card.querySelector('[data-swap]');
    if (swapBox) swapBox.onchange = function () { SWAP[env.docId] = swapBox.checked; applySwap_(env); rerender_(env.docId); };
    var addReceipt = card.querySelector('[data-add-receipt]');
    if (addReceipt) addReceipt.onclick = function () {
      var files = card.querySelector('[data-receipt-file]').files;
      if (!files || !files.length) return showMsg_(msg, false, 'Pick the receipt first - a photo or a PDF - then click Add receipt.');
      addReceipt.disabled = true;
      showMsg_(msg, true, 'Sending the receipt to Claude...');
      readReceiptFiles_(files).then(function (atts) {
        return callServer_('inboxAddReceipt', { docId: env.docId, feed: env.feed || null, subject: env.subject || '', attachments: atts });
      }).then(function (r) {
        addReceipt.disabled = false;
        if (!r.ok) return showMsg_(msg, false, plainError_(r));
        // The card closes here and is set aside on the site while the receipt is read - no Save can race it.
        done('Got it - Claude is reading the receipt (a minute or two). When it matches this charge the card clears itself; if it does not match, the receipt comes back as its own card and this one returns in ten minutes.');
      }, function (err) { addReceipt.disabled = false; showMsg_(msg, false, err && err.message ? err.message : String(err)); });
    };

    var busy = function (on) { card.querySelectorAll('.verbs button').forEach(function (b) { b.disabled = on; }); };
    var done = function (html) {
      showMsg_(msg, true, html);
      card.querySelectorAll('.entry, .tot, .verbs, .note, img.thumb, .pdf').forEach(function (n) { n.classList.add('hidden'); });
      DATA.envelopes = DATA.envelopes.filter(function (e) { return e.docId !== env.docId; });
      counts_();
    };
    var fail = function (r) {
      busy(false);
      showMsg_(msg, false, plainError_(r));   // every refusal in Paul's words, the code underneath (audit 2026-10-24 #12)
    };

    // Save does what each line says: records the approved lines, and files the returned and dismissed ones in the
    // note - on the posted card, or on a dismissed one when nothing was kept.
    var saveBtn = card.querySelector('[data-save]');
    if (saveBtn) saveBtn.onclick = function () {   // partner money has no Save (partnerMoney_)
      var sorted = sortByDecision_(entries), toPost = splitByProperty_(sorted.keep), sum = sorted.sum;
      // The bank line is the proof of who paid: the receipt Paul was waiting for is paid from that account.
      var swap = toPost.length ? swapOf_(env, SWAP) : null;
      if (swap && !swap.earlier) toPost.forEach(function (e) { e.paid_from = swap.paid_from; });
      var waiting = isWaiting_(toPost);
      if (!sum.approve && !sum.returned && !sum.dismiss) return showMsg_(msg, false, 'Nothing on this card to save - type an amount and a description on the line, click Reprocess, or Dismiss all.');
      // A line to record with no kind of cost picked used to go to the books' engine and come back as
      // "BAD_ACCOUNT - account is not in the chart of accounts" - Paul read that as "it isn't set up for Venmo"
      // (2026-10-01, a 500.00 Venmo to a painter he had typed in by hand). Say what to click instead.
      if (toPost.some(function (e) { return (e.items || []).some(function (it) { return !it.account; }); })) {
        return showMsg_(msg, false, 'One more thing before Save: pick what kind of cost this is, in the box that says <b>What kind of cost is this?</b> just above the amount. ' +
          '(Paying a worker is <b>Rehab - subcontract labor</b>; things bought are <b>Rehab - materials</b>.) How it was paid - card, check, Venmo - does not matter here; "Paid from" already says which account.');
      }
      // The engine refuses a house account on OVERHEAD and a business account on a house (D-010); say it here, by line.
      var wrong = mismatchFlags_(toPost, DATA.pickers.accounts);
      if (wrong.length) return showMsg_(msg, false, 'One more thing before Save: ' + wrong.map(escapeHtml_).join('<br>'));
      var rest = [sum.returned ? money_(sum.returned) + ' returned' : '', sum.dismiss ? money_(sum.dismiss) + ' dismissed' : ''].filter(Boolean).join(', ');
      if (saveBtn.dataset.armed !== '1') {
        saveBtn.dataset.armed = '1';
        saveBtn.textContent = 'Click again: ' + (sum.approve ? 'record ' + money_(sum.approve) : 'record nothing') + (rest ? ', ' + rest : '') +
          (swap ? (swap.earlier ? ' in place of the one already in the books' : ' in place of the charge you were waiting on') : waiting ? ', waiting on the receipt' : '');
        setTimeout(function () { saveBtn.dataset.armed = ''; saveBtn.textContent = 'Save'; }, 5000);
        return;
      }
      busy(true);
      msg.classList.add('hidden');
      var broke = function (err) { fail({ error: 'SCRIPT', message: err && err.message ? err.message : err }); };
      if (!toPost.length) {
        callServer_('inboxDismiss', { docId: env.docId, note: sorted.note, feed: env.feed || null }).then(function (r) {
          if (!r.ok) return fail(r);
          done('Saved - nothing was added to the books (' + escapeHtml_(rest) + ').' + feedNote_(r.feed));
          if (env.source === 'feed' && env.feed && env.feed.account) rematch_(env.feed.account, msg);   // #17
        }, broke);
        return;
      }
      callServer_('inboxApprove', { docId: env.docId, entries: toPost, model: env.model || {}, note: sorted.note, feed: env.feed || null, supersedes: swap ? swap.txn_id : null }).then(function (r) {
        if (!r.ok) return fail(r);
        // The bank card this receipt answered is gone from the Bank statement tab too (tieOpenBankLine_).
        if (r.feed && r.feed.retired && r.feed.retired.length) DATA.envelopes = DATA.envelopes.filter(function (e) { return r.feed.retired.indexOf(e.docId) < 0; });
        done('Recorded ' + money_(sum.approve) + (rest ? ' - ' + escapeHtml_(rest) : '') + ' <span class="docid">' + r.txn_ids.map(escapeHtml_).join(', ') + '</span>' +
          ' <span data-finish="1">&middot; saving the receipt to Drive...</span>' + feedNote_(r.feed) + learnedNote_(r.learned) +
          (r.timings ? '<div class="docid">' + escapeHtml_(r.timings) + '</div>' : ''));
        // Step two runs while the user moves on: Drive filing, doc_url, line blocks, cache.
        var slot = msg.querySelector('[data-finish]');
        callServer_('inboxFinish', { docId: env.docId, txn_ids: r.txn_ids, entries: toPost, model: env.model || {}, attachments: env.attachments || [],
          bodyText: waiting ? '' : env.bodyText || '' }).then(function (f) {   // a placeholder has no receipt: its Receipt cell stays blank
          if (f.ok) {
            slot.innerHTML = (f.doc_url ? '&middot; <a href="' + escapeHtml_(f.doc_url) + '" target="_blank" rel="noopener">Drive file</a>' : '&middot; filed') +
              (f.timings ? ' <span class="docid">(' + escapeHtml_(f.timings) + ')</span>' : '');
          } else {
            slot.innerHTML = '<span style="color:#a50e0e">&middot; recorded, but the receipt did not save to Drive: ' + escapeHtml_(f.message) + '</span>';
          }
        }, function (err) { slot.innerHTML = '<span style="color:#a50e0e">&middot; recorded, but the receipt did not save to Drive: ' + escapeHtml_(err && err.message ? err.message : err) + '</span>'; });
      }, broke);
    };

    var note = card.querySelector('.note');
    card.querySelector('[data-dismiss]').onclick = function () { note.classList.remove('hidden'); note.querySelector('input').focus(); };
    card.querySelector('[data-dismiss-cancel]').onclick = function () { note.classList.add('hidden'); };
    card.querySelector('[data-dismiss-go]').onclick = function () {
      var reason = note.querySelector('input').value.trim();
      if (!reason) return;
      busy(true);
      callServer_('inboxDismiss', { docId: env.docId, note: reason, feed: env.feed || null }).then(function (r) {
        if (!r.ok) return fail(r);
        done('Dismissed all - ' + escapeHtml_(reason) + feedNote_(r.feed));
        if (env.source === 'feed' && env.feed && env.feed.account) rematch_(env.feed.account, msg);   // #17
      }, function (err) { fail({ error: 'SCRIPT', message: err && err.message ? err.message : err }); });
    };

    card.querySelector('[data-reprocess]').onclick = function () {
      busy(true);
      callServer_('inboxReprocess', { docId: env.docId }).then(function (r) {
        if (!r.ok) return fail(r);
        done('Claude is reading it again - click Refresh in a minute or two.');
      }, function (err) { fail({ error: 'SCRIPT', message: err && err.message ? err.message : err }); });
    };
  }

  // Two loads side by side, each reported as it goes with a running clock (Paul, 2026-09-28: "when
  // the inbox is loading i want more information"): the receipts come from the site, the pickers
  // from the workbook. The cards are built once both are in.
  function load_() {
    var top = document.getElementById('msg');
    top.classList.add('hidden');
    DATA.ok = false;
    document.getElementById('empty').classList.add('hidden');
    var list = document.getElementById('list');
    var waiting = { receipts: 'asking the site for what is waiting for you', pickers: 'reading the houses, accounts and stores from the workbook' }, done = {};
    // Built once; only the text and the bar's width change after this (a rebuilt bar flashes).
    list.innerHTML = '<div class="loading"><div class="bar"><div></div></div>' +
      Object.keys(waiting).map(function (k) { return '<div data-step="' + k + '"></div>'; }).join('') + '<div data-step="cards"></div></div>';
    var fill = list.querySelector('.bar div'), row = function (k) { return list.querySelector('[data-step="' + k + '"]'); };
    var t0 = Date.now(), since = t0, landed = 0;
    // One bar for the whole load: a third per part (receipts, pickers, cards), creeping a little
    // while a part is still on its way so it never looks stuck.
    var paint = function () {
      var secs = Math.floor((Date.now() - t0) / 1000);
      Object.keys(waiting).forEach(function (k) { row(k).textContent = done[k] ? '\u2713 ' + done[k] : '\u2026 ' + waiting[k] + ' (' + secs + ' s)'; });
      fill.style.width = Math.min(99, landed * 33 + Math.min(20, (Date.now() - since) / 1000 * 4)) + '%';
    };
    var tick = setInterval(paint, 250); paint();
    var fail = function (r) {
      clearInterval(tick);
      showMsg_(top, false, plainError_(r));
      list.innerHTML = '';
    };
    var landedOne = function () { landed++; since = Date.now(); paint(); };
    var envelopes = null, pickers = null;
    var finish = function () {
      if (!envelopes || !pickers) return;
      clearInterval(tick);
      DATA = { ok: true, envelopes: envelopes.envelopes || [], total: envelopes.total, pickers: pickers.pickers, user: pickers.user };
      heartbeatLine_(envelopes.heartbeat);
      EDIT = {};
      // Refresh keeps Paul on his tab, unless it is empty and the other one is not.
      var n = { receipts: 0, bank: 0 }, other = TAB === 'bank' ? 'receipts' : 'bank';
      DATA.envelopes.forEach(function (e) { n[tabOf_(e)]++; });
      if (!n[TAB] && n[other]) TAB = other;
      row('cards').textContent = '\u2026 building ' + DATA.envelopes.length + ' card' + (DATA.envelopes.length === 1 ? '' : 's');
      fill.style.width = '100%';
      setTimeout(render_, 300);
    };
    callServer_('inboxEnvelopes').then(function (r) {
      if (!r.ok) return fail(r);
      var bank = (r.envelopes || []).filter(function (e) { return tabOf_(e) === 'bank'; }).length, rec = (r.envelopes || []).length - bank;
      envelopes = r; done.receipts = rec + ' receipt' + (rec === 1 ? '' : 's') + ' and ' + bank + ' bank statement line' + (bank === 1 ? '' : 's') + ' waiting for you'; landedOne(); finish();
    }, fail);
    callServer_('inboxPickers').then(function (r) {
      if (!r.ok) return fail(r);
      pickers = r; done.pickers = 'houses, accounts and stores ready'; landedOne(); finish();
    }, fail);
  }

  document.getElementById('refresh').onclick = load_;
  document.getElementById('collapse').onclick = function () { OPEN = {}; render_(); };
  document.getElementById('filter').oninput = filter_;
  document.querySelectorAll('#tabs button').forEach(function (b) { b.onclick = function () { TAB = b.dataset.tab; filter_(); }; });
  load_();
</script>
